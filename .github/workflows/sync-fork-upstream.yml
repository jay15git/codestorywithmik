name: Sync fork from upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          repository: jay15git/LeetCode
          token: ${{ secrets.FORK_SYNC_TOKEN }}
          fetch-depth: 0

      - name: Sync from upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/walkccc/LeetCode.git || true
          git fetch upstream main
          git checkout main
          git merge upstream/main --no-edit
          git push origin main

      - name: Trigger site rebuild
        if: success()
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "No VERCEL_DEPLOY_HOOK_URL set — skipping site rebuild"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
